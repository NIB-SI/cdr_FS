; ---------------------------------------------------------------------------
; cdr_FS configuration template --- copy this file and edit it.
;
; A general starting point for a new dataset. It is deliberately not runnable
; as it stands: the column names below are placeholders for your own, and so
; are the two paths. Fill those in and it runs.
;
;   examples/published.ini    the published RTgill-W1 run, values and all
;   examples/quickstart.ini   runs unedited against the committed test fixture
;   docs/                     the reasoning behind every key; start with
;                             docs/experiment-design.md, which says which keys
;                             state a fact about your EXPERIMENT and which are
;                             choices about the METHOD
;
; How to read this file
;   * a key written UNCOMMENTED is one you have to decide;
;   * a key written COMMENTED OUT shows its default --- uncomment it to change
;     it, leave it alone to accept it.
;     The three [trim] percentile keys are the one exception, and say so where
;     they appear: they have no defaults worth showing, so what is commented
;     there is a sensible starting value.
; So the structure below is complete: every switch the tool has is here, and
; `cdr-fs check` lists the defaults it filled in, which is the same list as the
; commented keys you did not touch.
;
; Syntax. Values are read literally --- no quoting --- and ';' starts a comment,
; inline as well as at the start of a line. /PATH/TO/... means "edit this": a
; committed configuration never carries a real path. All ten sections must be
; present even when every key in them is left at its default, so that a
; mistyped section name is an error rather than a silent fall-back.
;
; Running it
;   cdr-fs check -c config.ini [--scan]   validate, and report how the columns
;                                         and the exposure axis resolved
;   cdr-fs run   -c config.ini            the whole chain, in order:
;                                         emd -> fit -> select -> correlation
;                                         -> drop_missing -> plot
; `correlation` is skipped when its switch is off; `drop_missing` always runs,
; because it writes the final table. `trim` is NOT part of `run`: every stage
; applies the configured trim to [input] table itself, and `cdr-fs trim` exists
; only to write the trimmed copy out for inspection. `plot` inside a run draws
; only the retained features --- `cdr-fs plot -c config.ini` on its own draws
; every feature, which is hundreds of pages on a real dataset.
; ---------------------------------------------------------------------------

[input]
; The per-object table: one row per object, columns split into metadata and
; measured features by [schema] below.
table = /PATH/TO/objects.tsv
; sep = tab                      ; tab | comma | semicolon --- a keyword, because
                                 ; .ini has no escapes and "\t" would arrive as
                                 ; a literal backslash-t

[schema]
; Where the boundary between bookkeeping and measurement lies, and which columns
; carry the design. All four state facts about the experiment.
;
; !! metadata_patterns is an INVERSION. The patterns name the METADATA, and every
; column they fail to match becomes a feature. A pattern that matches too broadly
; therefore discards real measurements, and nothing later in the run says so.
; Run `cdr-fs check` before anything else and read its [columns] line; if the
; feature count is not the one you expect, fix this key first.
;
; One regex per line, so a pattern may itself contain commas. Patterns are
; searched, not fullmatched: anchor with ^...$ to name a single column.
metadata_patterns =
    ^plate$
    ^well$
    ^timepoint$
    ^replicate$
    ^exposure$
    ^object_id$
condition = exposure             ; column holding each object's exposure level
group_by = timepoint             ; stratification; empty = one stratum
pool_over = replicate            ; replicate column; empty = no replicate structure
; With pool_over left empty, set [emd] baseline = none as well: the default
; baseline compares replicates with each other, so an experiment that has none
; is an error rather than a run with a missing floor.

[design]
; The exposure axis --- the part of the configuration that is nothing but a
; statement about the experiment.
control = C0                     ; the unexposed arm; exactly one label
; Ordered LOW -> HIGH, and the control is not in the list. The labels are opaque
; strings and nothing sorts them: this order IS the response axis, and the labels
; themselves tell the tool nothing.
;
; !! A list written high to low runs to completion, produces an identical distance
; table, and negates every linear slope. It does NOT come out empty, which would at
; least be a signal: with the default slope_positive = any a feature is kept
; whenever ANY stratum sloped the other way, so what you get is a short, plausible
; list that partly overlaps the right one. `dose` below is the only automatic guard,
; and it catches only the two lists DISAGREEING --- reverse both and the check still
; passes. The backstop is the "exposure axis" line that `cdr-fs check` prints; read
; it against your own plate map.
levels = L1,L2,L3,L4,L5,L6
; The actual exposure magnitudes, index-matched to `levels` and strictly rising.
; Required for [fit] x_scale = dose, and worth giving even when fitting on rank,
; because it is that guard.
dose = 0.1,0.3,1,3,10,30
; Levels measured but withheld from the curve --- a top dose above the regime the
; curve should describe, say. EMD is still computed for them; only the fitting
; skips them, which shortens the series [fit] models has to be identifiable on.
; exclude_from_fit =

[trim]
; Data-level QC against badly measured objects: per feature, within each group of
; `scope`, values outside the percentile interval are discarded. It removes
; VALUES, not rows, so N differs per feature afterwards. Trimming changes the
; data, so the switch is stated rather than defaulted.
enabled = false
; These three are not defaults --- they become REQUIRED the moment `enabled` is
; true. Sensible starting values, shown so the shape is visible. The kept interval
; is closed, and `scope` should name one physical unit of the assay.
; lower_percentile = 2.5         ; values BELOW this percentile are removed
; upper_percentile = 97.5        ; values ABOVE this percentile are removed
; scope = timepoint,replicate,well

[emd]
; The earth mover's distance between the control population and each exposed one,
; per feature and stratum. Method choices; the defaults are the published ones.
; contrasts = control_vs_each    ; or an explicit list: C0vL1,C0vL2,...
; baseline = control_across_replicates   ; the between-replicate reproducibility
                                 ; floor to read the treatment distances against;
                                 ; `none` when the experiment has no replicates
; per_replicate = false          ; false pools the replicates into one distribution
                                 ; per level: one point per exposure level. true
                                 ; computes one distance per replicate instead

[fit]
; Six concentration-response models fitted to each distance series and ranked by
; information criterion. A method choice the DESIGN constrains: a curve needs more
; points than free parameters, counting the levels left after exclude_from_fit.
; Six fitted levels carry all six models; five rules out BC5, which has five
; parameters; three or four leave only Lin,Con --- still a question, but not
; concentration-response modelling. [select] needs both Lin and Con in the list.
; models = BC4,BC5,LL4,WB1.4,Lin,Con
; Where the levels sit on the x-axis. `rank` puts them at 0,1,2,... --- what the
; published run used, and what suits Lin, since for a geometric dilution series
; the rank is log-dose up to an affine shift. `dose` puts them at [design] dose,
; which is what spaces them evenly in log-concentration and so suits the four
; sigmoids, which take log(x) themselves. Switch to `dose` when your series is not
; geometrically spaced. -> docs/configuration.md#spacing-the-exposure-axis
; x_scale = rank
; rank_by = aic_plus_bic         ; aic_plus_bic | aic | bic

[select]
; The retention rule: keep a feature when its linear slope is positive and the
; constant model is not the best fit. The two halves use DIFFERENT quantifiers by
; default --- a positive slope on ANY stratum, the constant model beaten on ALL of
; them. Setting both to `all` gives the stricter rule.
;
; false turns the concentration-response selection off altogether: emd, fit and
; select are all skipped, and every feature carries forward into [correlation] and
; [drop_missing]. That is the tool used as a plain redundancy and sparsity filter
; --- useful, and no longer the published method, so it is stated rather than
; defaulted. [design] is still read, and still checked against the data.
enabled = true
; slope_positive = any           ; any | all
; nonconstant = all              ; any | all
; strata =                       ; default: every stratum present in the data.
                                 ; Naming strata narrows the WHOLE run, not just
                                 ; this stage --- emd and fit read it too

[correlation]
; Optional redundancy collapsing: features are clustered on 1 - |r| and one member
; of each cluster is kept, so a strong negative correlation counts as redundancy.
enabled = true
; The unit correlations are computed across: features are aggregated to one median
; profile per group of these columns, then correlated over those profiles. It must
; name a unit that VARIES along the exposure axis --- if each unit spans the whole
; series then every unit looks alike and nothing collapses. Omitted entirely it
; defaults to [trim] scope, which is empty here, so it has to be given; set it to
; nothing to correlate the object rows as they are.
aggregate_by = timepoint,replicate,well
; threshold = 0.9                ; on |r|; the tree is cut at 1 - threshold
; linkage = average              ; average | complete | single
; representative = alphabetical  ; which cluster member survives: alphabetical | first
; fill_missing = column_mean     ; substitutes a feature's overall mean for each
                                 ; value trimming removed, before aggregating;
                                 ; `none` medians whatever is actually present

[drop_missing]
; The last stage that touches the data, and it writes the FINAL TABLE whatever
; `enabled` says --- the switch only decides whether the missing-data filter drops
; anything. Trimming removes values rather than rows, so a feature can be missing
; for most objects and still be present as a column; this is what leaves those out.
enabled = true
; max_missing = 30               ; percent; missing this much OR MORE is dropped
; Exact feature names --- not patterns --- to leave out of the final table whatever
; their quality: the escape hatch for a judgement no rule expresses. A name that
; matches nothing is reported by `cdr-fs check` rather than quietly doing nothing.
; exclude =

[output]
; Where every stage writes, and where each stage reads the previous one's output
; from under a stable name. Two runs pointed at one directory overwrite.
dir = /PATH/TO/results
