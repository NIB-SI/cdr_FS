; ---------------------------------------------------------------------------
; Reference configuration — reproduces the published concentration-response
; feature selection of
;
;   Tome, M.; Jozef, B.; Mosimann, S. L.; Kosnik, M.; Schirmer, K.; Zupanic, A.
;   A High-Content Imaging Pipeline to Investigate Subcytotoxic Effects in
;   RTgill-W1 Cells. Environ. Sci. Technol. 2026, 60 (31), 21402-21416.
;   https://doi.org/10.1021/acs.est.5c18316
;
; Input is the untrimmed, row/plate standardized per-cell table from the
; accompanying dataset, https://doi.org/10.5281/zenodo.17951792 --- file
; cell_ID_pooled_median_row_plate_standardization_cid.txt, 503,920 cells x 481
; columns. Trimming lives in this tool, so it starts from the untrimmed table
; and reproduces the trim step itself.
;
; Replace /PATH/TO with wherever you unpacked the dataset. Values are read
; literally: no quoting, and ';' starts a trailing comment. Every section must
; be present even when all of its keys are left at their defaults, so that a
; mistyped section name is an error rather than a silent fall-back.
; ---------------------------------------------------------------------------

[input]
table = /PATH/TO/cell_ID_pooled_median_row_plate_standardization_cid.txt
sep = tab                        ; tab | comma | semicolon

[schema]
; Everything NOT matched here is a feature. One regex per line, so a pattern may
; itself contain commas. Patterns are searched, not fullmatched: anchor with
; ^...$ to name a single column.
;
; !! Do not collapse the three counts_ lines into a single ^counts_ pattern. !!
; The table has five counts_ columns and only three of them are metadata. The
; other two, counts_RelateLysoCell and counts_RelateMitoCell, are the per-cell
; lysosomal and mitochondrial counts the article appends to each cell's profile
; --- they are features, and counts_RelateLysoCell survives the whole selection
; into the published retained list. A bare ^counts_ would classify all five as
; metadata and silently discard a retained feature.
;
; This split resolves to 10 metadata + 471 features
; (469 rp_norm_* + counts_RelateLysoCell + counts_RelateMitoCell).
metadata_patterns =
    ^Metadata_
    ^Concentration$
    ^Tech_replica$
    ^Day_Well_BR$
    ^cell_ID$
    ^counts_Cells$
    ^counts_Cytoplasm$
    ^counts_FilteredNuclei$
condition = Concentration        ; column holding the exposure level
group_by = Metadata_Day          ; stratification; leave empty for one stratum
pool_over = Metadata_Biorep      ; replicates merged into one distribution

[design]
control = 11
; Ordered LOW -> HIGH. The labels are opaque strings; this ordering, not their
; numeric value, is the concentration-response axis. In this dataset the
; labelling is inverted relative to dose: 10 is the lowest exposure and 2 the
; highest, with 11 the unexposed control.
levels = 10,9,8,7,6,5,4,3,2
; Nominal exposures in mg/L, index-matched to `levels`. A 1.75-fold serial
; dilution from 1000 mg/L, i.e. 1000 / 1.75^k for k = 8..0, given here to full
; precision; the article's SI prints the same series truncated (1000, 571.42,
; 326.530, 186.588 ... 11.36).
;
; The published run does NOT use these values: it fits against the rank of the
; level (see [fit] x_scale, which explains why rank and dose are not
; interchangeable). The vector documents the design and makes x_scale = dose
; available.
dose = 11.368302,19.894529,34.815426,60.926995,106.622241,186.588921,326.530612,571.428571,1000.0
; The highest exposure is withheld from curve fitting so that
; concentration-response detection stays within sub-cytotoxic exposure levels.
; EMD is still computed for it; only the fitting skips it. That leaves the eight
; fitted contrasts 11v10, 11v9, ... 11v3.
exclude_from_fit = 2

[trim]
; Data-level QC against badly segmented objects: per feature, within each well
; of each replicate on each day, values outside the interval are discarded.
; Trimming removes values rather than rows, so N differs per feature.
enabled = true
lower_percentile = 2.5           ; values BELOW this percentile are removed
upper_percentile = 97.5          ; values ABOVE this percentile are removed
scope = Metadata_Day,Metadata_Biorep,Metadata_Well

[emd]
contrasts = control_vs_each      ; or an explicit list: 11v10,11v9,...
baseline = control_across_replicates   ; the between-replicate reproducibility floor
; false pools the replicates into one distribution per level, giving one EMD per
; feature, stratum and contrast --- eight points per curve, which is the
; published behaviour. true computes one EMD per replicate instead; it changes
; the numbers, so it no longer reproduces the article.
per_replicate = false

[fit]
models = BC4,BC5,LL4,WB1.4,Lin,Con
; rank fits against the position of the level along `levels`; this is what the
; published run used. dose fits against the values in [design] dose instead.
;
; The two are NOT equivalent, not even for a geometric series: the four sigmoid
; models evaluate log(x) themselves, and log(affine(rank)) is not
; affine(log(rank)). Only Lin and Con are invariant. The sign of the linear slope
; is preserved either way, so the slope half of the retention rule is unaffected;
; the sigmoid models simply fit less well against rank, which makes the
; "constant is not best" half slightly harder to pass. Conservative, not wrong.
x_scale = rank
rank_by = aic_plus_bic

[select]
; The published rule is a hybrid, and the two halves use different quantifiers:
; a positive linear slope on ANY stratum, and the constant model beaten on ALL
; strata. Setting both to `all` gives the stricter rule.
slope_positive = any
nonconstant = all
strata = D1,D5,D7,D9

[prune]
; Optional redundancy pruning: cluster features by 1-|r| and keep one per
; cluster. 0.9 on |r| is the 0.1 distance threshold of the published run.
enabled = true
threshold = 0.9
linkage = average
representative = alphabetical
; Correlations are computed between features aggregated to one median profile
; per experimental unit --- here one well of one replicate on one day, which is
; the same unit trimming works within. Left out, it defaults to [trim] scope;
; set to nothing to correlate the object rows as they are.
aggregate_by = Metadata_Day,Metadata_Biorep,Metadata_Well
; Trimming leaves gaps, and column_mean substitutes the feature's overall mean
; for each missing object value before aggregating, as the published run did.
; For a feature with many trimmed values that pulls its unit medians toward the
; global mean and shrinks the spread the correlation sees --- worth knowing,
; because on this dataset the choice moves the cluster count by eight. `none`
; medians whatever values are actually present.
fill_missing = column_mean

[subset]
; Trimming removes values rather than rows, so a feature can be missing for most
; objects and still be present as a column. This drops the ones too empty to
; carry: a feature missing max_missing percent of the table OR MORE is left out.
;
; It is applied here, over the whole table, before anything downstream
; subsamples --- one decision for the whole experiment, so a feature is either in
; the analysis or out of it. The published pipeline applied the same 30% rule per
; subsample instead, in its dimension-reduction step, which lets one feature be
; present on one day and absent on another.
drop_missing = true
max_missing = 30                 ; percent

[output]
dir = /PATH/TO/results
