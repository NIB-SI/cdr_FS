; ---------------------------------------------------------------------------
; Reference configuration --- reproduces the published concentration-response
; feature selection of
;
;   Tome, M.; Jozef, B.; Mosimann, S. L.; Kosnik, M.; Schirmer, K.; Zupanic, A.
;   A High-Content Imaging Pipeline to Investigate Subcytotoxic Effects in
;   RTgill-W1 Cells. Environ. Sci. Technol. 2026, 60 (31), 21402-21416.
;   https://doi.org/10.1021/acs.est.5c18316
;
; Input is the untrimmed, row/plate standardized per-cell table from the
; accompanying dataset, https://doi.org/10.5281/zenodo.17951792 --- file
; cell_ID_pooled_median_row_plate_standardization_cid.txt, 503,920 cells x 481
; columns. Trimming lives in this tool, so the run reproduces that step.
;
; Replace /PATH/TO with wherever you unpacked the dataset. Values are read
; literally: no quoting, and ';' starts a trailing comment. Every section must
; be present even when all of its keys are left at their defaults, so that a
; mistyped section name is an error rather than a silent fall-back.
;
; No argument is made here --- the article and docs/ carry the reasoning, and
; docs/reproducing.md explains these values. For a general starting point on a
; new dataset, copy examples/template.ini instead.
; ---------------------------------------------------------------------------

[input]
table = /PATH/TO/cell_ID_pooled_median_row_plate_standardization_cid.txt
sep = tab                        ; tab | comma | semicolon

[schema]
; Everything NOT matched here is a feature. Do not collapse the three counts_
; lines into ^counts_: the other two are per-cell organelle counts, and one of
; them survives into the published retained list. -> 18 metadata + 463 features.
metadata_patterns =
    ^Metadata_
    ^Concentration$
    ^Tech_replica$
    ^Day_Well_BR$
    ^cell_ID$
    ^counts_Cells$
    ^counts_Cytoplasm$
    ^counts_FilteredNuclei$
    Number_Object_Number         ; CellProfiler's object index, not a measurement
condition = Concentration        ; column holding the exposure level
group_by = Metadata_Day          ; stratification; leave empty for one stratum
pool_over = Metadata_Biorep      ; replicates merged into one distribution

[design]
control = 11                     ; the unexposed arm
; Ordered LOW -> HIGH. This dataset's labels count DOWN: 10 lowest, 2 highest.
levels = 10,9,8,7,6,5,4,3,2
; Nominal mg/L, index-matched to `levels`; they check the direction of the axis.
dose = 11.368302,19.894529,34.815426,60.926995,106.622241,186.588921,326.530612,571.428571,1000.0
exclude_from_fit = 2             ; top dose, withheld to keep detection sub-cytotoxic

[trim]
enabled = true                   ; removes values, not rows, within each scope group
lower_percentile = 2.5           ; values BELOW this percentile are removed
upper_percentile = 97.5          ; values ABOVE this percentile are removed
scope = Metadata_Day,Metadata_Biorep,Metadata_Well

[emd]
contrasts = control_vs_each      ; or an explicit list: 11v10,11v9,...
baseline = control_across_replicates   ; the between-replicate reproducibility floor
per_replicate = false            ; pools replicates into one distribution per level

[fit]
models = BC4,BC5,LL4,WB1.4,Lin,Con
x_scale = rank                   ; rank | dose --- not equivalent; docs/configuration.md
rank_by = aic_plus_bic           ; aic_plus_bic | aic | bic

[select]
slope_positive = any             ; a positive linear slope on ANY stratum ...
nonconstant = all                ; ... and the constant model beaten on ALL of them
strata = D1,D5,D7,D9

[correlation]
enabled = true                   ; cluster on 1 - |r|, keep one feature per cluster
threshold = 0.9                  ; on |r|; the tree is cut at 1 - threshold
linkage = average
representative = alphabetical
aggregate_by = Metadata_Day,Metadata_Biorep,Metadata_Well   ; correlate unit medians
fill_missing = column_mean       ; fills trimmed gaps with the feature's overall mean

[drop_missing]
enabled = true                   ; over the whole table, before anything subsamples
max_missing = 30                 ; percent; missing this much OR MORE is dropped
exclude =                        ; exact names; empty --- see docs/reproducing.md

[output]
dir = /PATH/TO/results
