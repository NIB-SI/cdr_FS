; ---------------------------------------------------------------------------
; cdr_FS quickstart --- runnable as it stands, from the repository root:
;
;   cdr-fs check -c examples/quickstart.ini --scan
;
; It points at the committed test fixture, tests/fixtures/subset.tsv: 1,272
; cells x 30 columns, a real slice of the published dataset. Small enough to
; run in a minute or two, large enough that every stage does something.
;
; This is a smoke test of the tool, not a reproduction of the method. It
; differs from examples/published.ini in two ways that matter, both noted
; below: trimming is off, and no level is withheld from the fit. Use
; published.ini for the method as it was published.
;
; The paths here are relative to the repository root, which is the one place
; a shipped example can point without knowing where you keep your data.
; Everywhere else, /PATH/TO/... means "edit this".
; ---------------------------------------------------------------------------

[input]
table = tests/fixtures/subset.tsv

[schema]
; Anything NOT matched here is a feature, so a pattern that is too broad
; silently removes measurements. The three QC counts_ columns are listed one
; by one on purpose: counts_RelateLysoCell and counts_RelateMitoCell are
; per-cell measurements, and a bare ^counts_ would swallow both. After a run,
; check the "[columns]" line of `cdr-fs check` and confirm the feature count
; is the one you expect --- nothing else can catch this for you.
metadata_patterns =
    ^Metadata_
    ^Concentration$
    ^Tech_replica$
    ^Day_Well_BR$
    ^cell_ID$
    ^counts_Cells$
    ^counts_Cytoplasm$
    ^counts_FilteredNuclei$
condition = Concentration        ; the column holding each cell's exposure level
group_by = Metadata_Day          ; one curve per stratum; leave empty for a single stratum
pool_over = Metadata_Biorep      ; replicates merged into one distribution

[design]
control = 11
; Ordered LOW -> HIGH. The labels are opaque strings, so this order --- not
; their numeric value --- is the concentration-response axis. Here the labels
; count down while the exposure climbs, which is why the order is written out
; rather than inferred.
levels = 10,9,8,7,6,5,4,3,2
; Index-matched to `levels`, in mg/L. The fit does not use them (see [fit]
; x_scale, default `rank`), but they are checked against `levels`: a dose
; vector that falls while the levels are declared to rise is refused. That
; catches the two lists disagreeing; it cannot catch both being wrong the same
; way, so read the "exposure axis" line of `cdr-fs check` as well.
dose = 11.368302,19.894529,34.815426,60.926995,106.622241,186.588921,326.530612,571.428571,1000.0

[trim]
; Off here, and that is a departure from the published run, which trims to
; [p2.5, p97.5] within each well. This fixture holds 1-8 cells per well ---
; far too few for a within-well percentile to mean anything, and trimming it
; the published way removes 55% of the values.
enabled = false

[emd]

[fit]

[select]

[prune]
enabled = true
; Required here, because it defaults to [trim] scope and trimming is off.
; One median profile per well of one replicate on one day, then the features
; are correlated across those profiles.
aggregate_by = Metadata_Day,Metadata_Biorep,Metadata_Well

[subset]
drop_missing = true              ; default max_missing = 30 percent

[output]
dir = results
